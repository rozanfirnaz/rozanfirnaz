<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our baby is on the way</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600&display=swap">
<style>
:root{
  --ink:#4a3560; --ink-soft:#7a6590; --card:rgba(255,255,255,.72); --line:rgba(255,255,255,.9);
  --sky1:#ffe3d6; --sky2:#ffd0e1; --sky3:#dcd0fb; --sky4:#bfe0fb; --accent:#e0568a; --track:rgba(74,53,96,.12);
  --cloud:#ffffff; --star:#ffd36b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#fff0f6; --ink-soft:#dccbec; --card:rgba(38,26,70,.62); --line:rgba(255,255,255,.2);
    --sky1:#5d3f78; --sky2:#43306f; --sky3:#2c2862; --sky4:#1b1d4c; --accent:#ffb3cf; --track:rgba(255,255,255,.18);
    --cloud:#5a4a8a; --star:#ffe08a;
  }
}
:root[data-theme="dark"]{
  --ink:#fff0f6; --ink-soft:#dccbec; --card:rgba(38,26,70,.62); --line:rgba(255,255,255,.2);
  --sky1:#5d3f78; --sky2:#43306f; --sky3:#2c2862; --sky4:#1b1d4c; --accent:#ffb3cf; --track:rgba(255,255,255,.18);
  --cloud:#5a4a8a; --star:#ffe08a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden; position:relative;
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55;
  background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 28%,var(--sky3) 62%,var(--sky4) 100%) fixed;
  display:flex; justify-content:center; padding:36px 18px 56px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10;}
h1,.big,.when{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
.deco{position:fixed; inset:0; pointer-events:none; z-index:0}
.deco svg{position:absolute}
.cloud{fill:var(--cloud); opacity:.85}
.star{fill:var(--star)}
.wrap{position:relative; z-index:1; width:100%; max-width:540px; text-align:center}
.hero{width:min(230px,58vw); margin:0 auto -6px; display:block; animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-weight:600; font-size:clamp(1.9rem,7vw,2.7rem); line-height:1.1; margin:0 0 6px}
.sub{margin:0 0 24px; color:var(--ink-soft); font-size:1.1rem}
.card{
  position:relative; background:var(--card); border:2px solid var(--line); border-radius:34px; padding:26px 22px; margin-bottom:18px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.label{margin:0 0 2px; color:var(--ink-soft); font-size:1.02rem; font-weight:600}
.big{font-weight:600; font-size:clamp(4.4rem,23vw,7.2rem); line-height:1; margin:2px 0; color:var(--accent)}
.when{font-size:2.3rem; font-weight:600; margin:0; color:var(--accent)}
.today{margin:14px 0 0; font-size:1.08rem; font-weight:600}
.bar{height:16px; border-radius:99px; background:var(--track); margin:18px 8px 8px; position:relative}
.fill{height:100%; width:0; background:linear-gradient(90deg,#ffa6c4,var(--accent)); border-radius:99px; transition:width 1.4s ease-out}
.dot{position:absolute; top:50%; left:0; width:30px; height:30px; transform:translate(-50%,-50%); transition:left 1.4s ease-out}
.ends{display:flex; justify-content:space-between; font-size:.88rem; color:var(--ink-soft); margin:0 4px}
.mini{width:64px; height:64px; position:absolute; top:-26px; right:18px}
.foot{display:flex; justify-content:center; gap:14px; margin-top:6px}
.foot svg{width:54px; height:54px}
.clock{display:flex; justify-content:center; gap:10px; margin:16px 0 4px}
.unit{min-width:84px; padding:10px 8px 8px; border-radius:22px; background:var(--track); border:2px solid var(--line)}
.unit b{display:block; font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif; font-weight:600; font-size:2rem; line-height:1.1; color:var(--ink); font-variant-numeric:tabular-nums}
.unit span{font-size:.85rem; color:var(--ink-soft); font-weight:600}
@media (max-width:380px){.unit{min-width:72px}.unit b{font-size:1.7rem}}
@media (prefers-reduced-motion: reduce){.fill,.dot{transition:none}.hero{animation:none}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <svg class="cloud" style="top:6%;left:-30px" width="170" height="70" viewBox="0 0 170 70"><path d="M20 60a20 20 0 0 1 4-39 28 28 0 0 1 54-6 24 24 0 0 1 44 12 18 18 0 0 1 28 33z"/></svg>
  <svg class="cloud" style="top:34%;right:-40px" width="190" height="80" viewBox="0 0 170 70"><path d="M20 60a20 20 0 0 1 4-39 28 28 0 0 1 54-6 24 24 0 0 1 44 12 18 18 0 0 1 28 33z"/></svg>
  <svg class="cloud" style="bottom:8%;left:-50px" width="200" height="84" viewBox="0 0 170 70"><path d="M20 60a20 20 0 0 1 4-39 28 28 0 0 1 54-6 24 24 0 0 1 44 12 18 18 0 0 1 28 33z"/></svg>
  <svg class="star" style="top:12%;right:12%" width="26" height="26" viewBox="0 0 24 24"><path d="M12 1l3.2 7 7.6.8-5.7 5.1 1.7 7.5L12 17.5 5.2 21.4l1.7-7.5L1.2 8.8 8.8 8z"/></svg>
  <svg class="star" style="top:26%;left:9%" width="18" height="18" viewBox="0 0 24 24"><path d="M12 1l3.2 7 7.6.8-5.7 5.1 1.7 7.5L12 17.5 5.2 21.4l1.7-7.5L1.2 8.8 8.8 8z"/></svg>
  <svg class="star" style="top:58%;right:7%" width="20" height="20" viewBox="0 0 24 24"><path d="M12 1l3.2 7 7.6.8-5.7 5.1 1.7 7.5L12 17.5 5.2 21.4l1.7-7.5L1.2 8.8 8.8 8z"/></svg>
  <svg class="star" style="top:76%;left:12%" width="24" height="24" viewBox="0 0 24 24"><path d="M12 1l3.2 7 7.6.8-5.7 5.1 1.7 7.5L12 17.5 5.2 21.4l1.7-7.5L1.2 8.8 8.8 8z"/></svg>
</div>

<main class="wrap">
  <!-- Cartoon baby in a blanket -->
  <svg class="hero" viewBox="0 0 240 230" role="img" aria-label="Cartoon baby wrapped in a blanket">
    <ellipse cx="120" cy="214" rx="78" ry="9" fill="#000" opacity=".08"/>
    <path d="M42 150c0-38 34-62 78-62s78 24 78 62c0 36-28 60-78 60s-78-24-78-60z" fill="#b9a4f0"/>
    <path d="M60 176c18 12 40 18 60 18s42-6 60-18c-4 22-28 36-60 36s-56-14-60-36z" fill="#a58ee6"/>
    <circle cx="120" cy="96" r="58" fill="#ffd9bd"/>
    <path d="M104 44c6-14 24-14 28 0-8-4-18-4-28 0z" fill="#8a5a3c"/>
    <path d="M116 38c0-9 10-12 14-5" fill="none" stroke="#8a5a3c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="100" r="9" fill="#ffd9bd"/><circle cx="178" cy="100" r="9" fill="#ffd9bd"/>
    <ellipse cx="97" cy="98" rx="6" ry="8" fill="#3b2a4a"/><ellipse cx="143" cy="98" rx="6" ry="8" fill="#3b2a4a"/>
    <circle cx="99" cy="95" r="2.2" fill="#fff"/><circle cx="145" cy="95" r="2.2" fill="#fff"/>
    <circle cx="82" cy="116" r="10" fill="#ffa9b8" opacity=".75"/><circle cx="158" cy="116" r="10" fill="#ffa9b8" opacity=".75"/>
    <path d="M108 118q12 14 24 0" fill="none" stroke="#3b2a4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M52 62l16 4-10 12z" fill="#f78fb3"/><path d="M52 62l-6 14 14-2z" fill="#f78fb3"/>
  </svg>

  <h1>Our little one is on the way</h1>
  <p class="sub">Counting every day until we say hello</p>

  <section class="card">
    <svg class="mini" viewBox="0 0 64 64" aria-hidden="true"><path d="M44 10a24 24 0 1 0 10 38A20 20 0 0 1 44 10z" fill="#ffd36b"/><circle cx="26" cy="30" r="2.4" fill="#e0a93a"/><circle cx="34" cy="42" r="3" fill="#e0a93a"/></svg>
    <p class="label">Days to go</p>
    <div class="big" id="days">–</div>
    <p class="label" id="daysNote">until we meet our baby</p>
    <div class="clock" role="timer" aria-label="Time remaining">
      <div class="unit"><b id="hh">00</b><span>hours</span></div>
      <div class="unit"><b id="mm">00</b><span>minutes</span></div>
      <div class="unit"><b id="ss">00</b><span>seconds</span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="Pregnancy progress" aria-valuemin="0" aria-valuemax="100" id="pb">
      <div class="fill" id="fill"></div>
      <svg class="dot" id="dot" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#ffd9bd" stroke="#fff" stroke-width="2"/><circle cx="10.5" cy="14" r="1.6" fill="#3b2a4a"/><circle cx="19.5" cy="14" r="1.6" fill="#3b2a4a"/><path d="M11 19q4 4 8 0" fill="none" stroke="#3b2a4a" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="ends"><span>Week 0</span><span>Week 40</span></div>
  </section>

  <section class="card">
    <p class="label">Baby is now</p>
    <p class="when" id="weeksNow">–</p>
    <p class="label" id="weeksDays"></p>
  </section>

  <div class="foot" aria-hidden="true">
    <!-- bottle -->
    <svg viewBox="0 0 54 54"><rect x="19" y="20" width="16" height="28" rx="6" fill="#fff" stroke="#e0568a" stroke-width="2.5"/><rect x="21" y="12" width="12" height="9" rx="3" fill="#f78fb3"/><path d="M27 3c4 0 5 5 5 9H22c0-4 1-9 5-9z" fill="#ffd9bd"/><path d="M20 32h14M20 38h14" stroke="#bfe0fb" stroke-width="3"/></svg>
    <!-- duck -->
    <svg viewBox="0 0 54 54"><ellipse cx="26" cy="38" rx="18" ry="12" fill="#ffd36b"/><circle cx="32" cy="20" r="12" fill="#ffd36b"/><path d="M42 21l10 3-10 4z" fill="#ff9d5c"/><circle cx="34" cy="18" r="2" fill="#3b2a4a"/><path d="M14 36q8 8 18 0" fill="none" stroke="#e0a93a" stroke-width="2.5" stroke-linecap="round"/></svg>
    <!-- teddy -->
    <svg viewBox="0 0 54 54"><circle cx="13" cy="13" r="7" fill="#c99a6e"/><circle cx="41" cy="13" r="7" fill="#c99a6e"/><circle cx="27" cy="26" r="19" fill="#d9ab7f"/><ellipse cx="27" cy="32" rx="9" ry="7" fill="#f3d9bd"/><circle cx="20" cy="23" r="2.2" fill="#3b2a4a"/><circle cx="34" cy="23" r="2.2" fill="#3b2a4a"/><ellipse cx="27" cy="30" rx="3" ry="2.2" fill="#3b2a4a"/></svg>
    <!-- rattle -->
    <svg viewBox="0 0 54 54"><circle cx="27" cy="18" r="14" fill="#9fd0f6"/><path d="M17 14q10 6 20 0M17 22q10 6 20 0" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="24" y="30" width="6" height="16" rx="3" fill="#f78fb3"/><circle cx="27" cy="49" r="4" fill="#f78fb3"/></svg>
  </div>
</main>

<script>
(function(){
  var DAY = 86400000;
  var EDD = Date.UTC(2027,5,10);
  var START = EDD - 280*DAY;
  var now = new Date();
  var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  var left = Math.round((EDD - today)/DAY);
  var since = Math.round((today - START)/DAY);
  var daysEl = document.getElementById('days');
  var note = document.getElementById('daysNote');
  var t = document.getElementById('today');

  if (left > 1){ daysEl.textContent = left; note.textContent = 'until we meet our baby'; }
  else if (left === 1){ daysEl.textContent = '1'; note.textContent = 'day until we meet our baby'; }
  else if (left === 0){ daysEl.textContent = 'Today'; daysEl.style.fontSize='clamp(3rem,16vw,5rem)'; note.textContent = 'could be the day!'; }
  else { daysEl.textContent = 'Any day now'; daysEl.style.fontSize = 'clamp(2.4rem,12vw,4rem)'; note.textContent = 'baby is almost here'; }

  if (since >= 0){
    var w = Math.floor(since/7), d = since % 7;
    document.getElementById('weeksNow').textContent = w + (w === 1 ? ' week' : ' weeks');
    document.getElementById('weeksDays').textContent = d ? 'and ' + d + (d === 1 ? ' day' : ' days') : 'exactly';
  }

  var pct = Math.max(0, Math.min(100, since/280*100));
  document.getElementById('pb').setAttribute('aria-valuenow', Math.round(pct));
  setTimeout(function(){
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('dot').style.left = pct + '%';
  }, 150);

  // Live ticking countdown (local midnight at the start of the due date)
  var target = new Date(2027,5,10,0,0,0).getTime();
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function tick(){
    var diff = target - Date.now();
    if (diff < 0) diff = 0;
    var s = Math.floor(diff/1000);
    var d = Math.floor(s/86400);
    if (d >= 1 && diff > 0){ daysEl.textContent = d; daysEl.style.fontSize = ''; }
    document.getElementById('hh').textContent = pad(Math.floor(s%86400/3600));
    document.getElementById('mm').textContent = pad(Math.floor(s%3600/60));
    document.getElementById('ss').textContent = pad(s%60);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
